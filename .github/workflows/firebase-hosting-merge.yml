name: Deploy Strider to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_STRIDER_WORKFLOW: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STRIDER_WORKFLOW }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Strider app
        run: npm run build

      - name: Run regression suite
        run: npm test

      - name: Assemble landing page at site root
        run: cp -R landing/. dist/

      - name: Install browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Deploy to Firebase Hosting
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_STRIDER_WORKFLOW != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STRIDER_WORKFLOW }}
          channelId: live
          projectId: strider-workflow

      - name: Verify live site after deployment
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_STRIDER_WORKFLOW != '' }}
        env:
          TARGET_URL: https://strider-workflow.web.app
        run: node scripts/browser-regression.mjs

      - name: Save live regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-browser-regression
          path: test-results/
          retention-days: 7

      - name: Firebase credentials not configured
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_STRIDER_WORKFLOW == '' }}
        run: echo "::warning::Add the FIREBASE_SERVICE_ACCOUNT_STRIDER_WORKFLOW repository secret to enable deployment."

# Firebase Hosting automation enabled for strider-workflow.
