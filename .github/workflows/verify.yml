name: Verify Strider
on:
  pull_request:
  push:
    branches: [main, 'codex/strider-graphics-*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Assemble landing
        run: cp -R landing/. dist/
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression
        run: node scripts/browser-regression.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression
          path: test-results/
          retention-days: 7
